name: Sources

# Is anything we ship out of date, and can we fetch what replaced it?
#
# Daily rather than weekly, and certainly rather than "every January": the tax
# tables move once a year, but the Euribor snapshot and the market statistics
# move monthly, and a source that changed in the first week of a month should
# not wait for the next sweep to be noticed. The job costs a minute of CPU, so
# the cadence is set by how fast the data moves rather than by what it costs.
#
# Three outcomes, kept separate on purpose:
#
#   * a tracking issue that always shows current state — edited in place, never
#     appended to, and closed when nothing is outstanding;
#   * a pull request, but only for the datasets whose values can be fetched and
#     validated end to end (the ECB-backed ones), and only when the whole test
#     suite passes with the new data in place;
#   * a red run, reserved for a source that has been superseded outright or a
#     probe that could not run. A "someone should re-read this law" prompt does
#     not fail the build, because a job that is red every morning is a job
#     nobody reads.
#
# The despachos, ofícios and the Recomendação are PDFs a person has to read.
# For those the issue is the whole deliverable: what to look at, and when it was
# last looked at.

on:
  schedule:
    # 06:30 UTC daily. The ECB posts a month's average in the first business
    # days of the following month, so this sees it the morning it appears.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sources
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  ISSUE_LABEL: sources
  ISSUE_TITLE: "Fontes: estado das fontes de dados"
  REFRESH_BRANCH: sources/auto-refresh

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `--probe` asks the publishers that expose a feed; `--warn-only` stops a
      # stale source failing the step before the issue has been written.
      - name: Check every source against its publisher
        run: |
          npm run sources:check -- --probe --warn-only \
            --json=sources-report.json \
            --markdown=sources-issue.md

      - name: Keep the tracking issue current
        run: |
          set -euo pipefail
          outstanding=$(jq '[.[] | select(.status != "current")] | length' sources-report.json)
          number=$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [ "$outstanding" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Every source is now the newest edition its publisher should have out. Closing; the daily run reopens this if that changes."
              gh issue close "$number"
            fi
            echo "Nothing outstanding."
            exit 0
          fi

          # The label may not exist yet on a fresh repository.
          gh label create "$ISSUE_LABEL" --description "Data sources that need looking at" --color FBCA04 || true

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file sources-issue.md
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file sources-issue.md
          fi

      - name: Pull the ECB-backed datasets forward
        id: refresh
        run: |
          set -uo pipefail
          # A refused refresh is not a reason to abandon the run: the check step
          # has already written the failure into the issue, and the final gate
          # goes red on a broken probe. Losing the rest of the job to a portal
          # having a bad morning would just make the daily signal unreliable.
          if ! npm run sources:refresh; then
            echo "Refresh refused; nothing was written. See the message above."
          fi
          if git diff --quiet -- packages/engine/src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dataset moved."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- packages/engine/src
          fi

      # The suite is what says a new vintage is usable. A refresh that breaks it
      # is a review prompt, not something to push at reviewers: the job fails,
      # loudly, and nothing lands.
      - name: Prove the new data before proposing it
        if: steps.refresh.outputs.changed == 'true'
        run: npm test

      - name: Open (or update) the refresh pull request
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$REFRESH_BRANCH"
          git add packages/engine/src
          git commit \
            -m "Sources: pull the ECB-backed datasets forward" \
            -m "Written by .github/workflows/sources.yml from the ECB Data Portal. The full test suite ran green against the new data before this was pushed."
          git push --force-with-lease origin "$REFRESH_BRANCH"

          existing=$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing now carries the newer data."
            exit 0
          fi

          cat > pr-body.md <<'BODY'
          The daily source check found a newer observation on the ECB Data Portal
          than the one in the bundle, and rewrote the dataset from it.

          Checked before this was pushed:

          - every value passed the plausibility bands in `packages/sources` — a
            percentage that never got divided by 100 is refused, not shipped;
          - a Euribor snapshot is written only when all three tenors answer for
            the same month;
          - the whole test suite ran green with the new data in place.

          Still needs a person: read the numbers against the portal, and check
          that the commentary carried into the new module is still true of this
          month's figures.

          Pushes made with the workflow token do not start CI, which is why the
          suite is run inside the job that opens this.
          BODY

          gh pr create \
            --head "$REFRESH_BRANCH" \
            --title "Sources: pull the ECB-backed datasets forward" \
            --body-file pr-body.md

      # Last, so the issue is written and any refresh proposed first. This one
      # fails only on the states that mean something is actually broken — see
      # `FAILING_BY_DEFAULT` in the CLI.
      - name: Fail if a source has been superseded outright
        run: npm run sources:check -- --probe
